html<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelaajatilastot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 10px; }
        h1 { text-align: center; font-size: 24px; margin-bottom: 15px; color: #1a1a1a; }
        .button-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 8px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button:active { background-color: #0056b3; }
        .full-width { grid-column: span 2; background-color: #dc3545; }
        .full-width:active { background-color: #bd2130; }
        .table-container { background: white; border-radius: 10px; overflow-x: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #eeeeee; white-space: nowrap; }
        th { background-color: #f8f9fa; font-weight: bold; color: #666; }
        tr:nth-child(even) { background-color: #eaedf2; }
        .active-sort td:nth-child(var(--active-col)) { background-color: #bae6fd !important; font-weight: bold; color: #000; }
        tr:last-child td { border-bottom: none; }
        .admin-section { display: none; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 20px; color: #333; }
        .admin-row { display: grid; grid-template-columns: 2fr repeat(4, 1fr) auto; gap: 4px; margin-bottom: 8px; align-items: center; }
        .admin-row input { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background-color: #fff; color: #333; }
        .admin-header { font-weight: bold; font-size: 12px; color: #666; text-align: center; }
        .admin-header:first-child { text-align: left; }
        .admin-buttons { margin-top: 15px; display: flex; gap: 10px; }
        .btn-sec { background-color: #6c757d; }
        .btn-danger { background-color: #dc3545; padding: 6px 10px; font-size: 12px; }
        .toggle-admin-btn { background-color: #28a745; margin-top: 20px; width: 100%; padding: 12px; font-size: 16px; }
    </style>
</head>
<body>

    <div id="publicView">
        <h1>🏆 Pelaajatilastot</h1>
        <div class="button-grid">
            <button onclick="sortData('o', 'desc')">Ottelut (Isoin ensin)</button>
            <button onclick="sortData('o', 'asc')">Ottelut (Pienin ensin)</button>
            <button onclick="sortData('v', 'desc')">Voitot (Isoin ensin)</button>
            <button onclick="sortData('v', 'asc')">Voitot (Pienin ensin)</button>
            <button onclick="sortData('m', 'desc')">Maalit (Isoin ensin)</button>
            <button onclick="sortData('m', 'asc')">Maalit (Pienin ensin)</button>
            <button onclick="sortData('gpg', 'desc')">Paras GPG</button>
            <button onclick="sortData('gpg', 'asc')">Pienin GPG</button>
            <button onclick="sortData('vPct', 'desc')">Paras Voitto%</button>
            <button onclick="sortData('vPct', 'asc')">Pienin Voitto%</button>
            <button onclick="sortData('ga', 'desc')" class="full-width">Päästetyt maalit</button>
        </div>
        <div class="table-container">
            <table id="statsTable">
                <thead>
                    <tr>
                        <th>Pelaaja</th><th>O</th><th>V</th><th>M</th><th>GPG</th><th>V%</th><th>GA</th><th>GAA</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <button class="toggle-admin-btn" onclick="openAdmin()">⚙️ Muokkaa tilastoja suoraan sivulla</button>
    </div>

    <div id="adminView" class="admin-section">
        <h2>🔒 Hallintapaneeli</h2>
        <div class="admin-row">
            <div class="admin-header">Nimi</div><div class="admin-header">O</div><div class="admin-header">V</div><div class="admin-header">M</div><div class="admin-header">GA</div><div></div>
        </div>
        <div id="adminRowsContainer"></div>
        <div class="admin-buttons">
            <button onclick="addNewPlayerRow()" class="btn-sec">+ Lisää pelaaja</button>
            <button onclick="saveDataToGitHub()">💾 Tallenna muutokset livenä</button>
            <button onclick="closeAdmin()" class="btn-sec">Peruuta</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            username: 'joonaaalto',
            repo: 'tilastot',
            salasana: 'joukkue123'
        };

        let dataset = [
            { nimi: "Matti Pelaaja", o: 10, v: 6, m: 12, ga: 4 },
            { nimi: "Pekka Pelaaja", o: 8, v: 4, m: 5, ga: 9 }
        ];

        function init() { calculateAverages(); renderTable(); }

        function calculateAverages() {
            dataset.forEach(p => {
                p.o = parseInt(p.o) || 0; p.v = parseInt(p.v) || 0; p.m = parseInt(p.m) || 0; p.ga = parseInt(p.ga) || 0;
                p.gpg = p.o > 0 ? (p.m / p.o).toFixed(2) : 0;
                p.vPct = p.o > 0 ? Math.round((p.v / p.o) * 100) : 0;
                p.gaa = p.o > 0 ? (p.ga / p.o).toFixed(2) : 0;
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            dataset.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${p.nimi}</b></td>
                    <td>${p.o}</td>
                    <td>${p.v}</td>
                    <td>${p.m}</td>
                    <td>${p.gpg > 0 ? p.gpg : ''}</td>
                    <td>${p.vPct > 0 ? p.vPct + '%' : ''}</td>
                    <td>${p.ga}</td>
                    <td>${p.gaa > 0 ? p.gaa : ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }
