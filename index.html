html<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelaajatilastot</title>
    <style>
        /* TÄSSÄ ON UUSI TUMMA JA TYYLIKÄS ULKOASU */
        :root {
            --bg-color: #121824;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #334155;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 10px; 
            -webkit-font-smoothing: antialiased;
        }
        h1 { 
            text-align: center; 
            font-size: 26px; 
            font-weight: 800;
            margin: 15px 0 20px 0; 
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .button-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 6px; 
            margin-bottom: 15px; 
            background: var(--card-bg);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }
        button { 
            background-color: #2e3b4e; 
            color: var(--text-main); 
            border: 1px solid var(--border); 
            padding: 10px 6px; 
            font-size: 13px; 
            font-weight: 600; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent; 
        }
        button:active { 
            background-color: var(--primary);
            border-color: var(--primary);
            transform: scale(0.98);
        }
        .full-width { 
            grid-column: span 2; 
            background-color: var(--danger); 
            border-color: transparent;
            font-size: 14px;
            padding: 12px 6px;
            margin-top: 4px;
        }
        .full-width:active { 
            background-color: var(--danger-hover); 
        }
        .table-container { 
            background: var(--card-bg); 
            border-radius: 12px; 
            overflow-x: auto; 
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left; 
            font-size: 14px; 
        }
        th, td { 
            padding: 12px 14px; 
            border-bottom: 1px solid var(--border); 
            white-space: nowrap; 
        }
        th { 
            background-color: #151f32; 
            font-weight: 700; 
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) {
            background-color: #243046;
        }
        tr:last-child td { 
            border-bottom: none; 
        }
        td b {
            color: #fff;
            font-size: 15px;
        }
        .loading { text-align: center; padding: 20px; font-weight: bold; color: var(--text-muted); }
    </style>
</head>
<body>

    <h1>🏆 Pelaajatilastot</h1>

    <div class="button-grid">
        <button onclick="sortData(1, 'desc')">Ottelut (Isot ensin)</button>
        <button onclick="sortData(1, 'asc')">Ottelut (Pienet ensin)</button>
        <button onclick="sortData(2, 'desc')">Voitot (Isot ensin)</button>
        <button onclick="sortData(2, 'asc')">Voitot (Pienet ensin)</button>
        <button onclick="sortData(3, 'desc')">Maalit (Isot ensin)</button>
        <button onclick="sortData(3, 'asc')">Maalit (Pienet ensin)</button>
        <button onclick="sortData(4, 'desc')">Paras GPG</button>
        <button onclick="sortData(4, 'asc')">Pienin GPG</button>
        <button onclick="sortData(5, 'desc')">Paras Voitto%</button>
        <button onclick="sortData(5, 'asc')">Pienin Voitto%</button>
        <!-- Nimetty uudelleen, muutettu punaiseksi ja poistettu muut GA/GAA napit -->
        <button onclick="sortData(6, 'desc')" class="full-width">Päästetyt maalit</button>
    </div>

    <div class="table-container">
        <div id="loading" class="loading">Ladataan tilastoja...</div>
        <table id="statsTable" style="display:none;">
            <thead>
                <tr>
                    <th>Pelaaja</th>
                    <th>O</th>
                    <th>V</th>
                    <th>M</th>
                    <th>GPG</th>
                    <th>V%</th>
                    <th>GA</th>
                    <th>GAA</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const sheetId = '11GpJty25_ftRoKPs_ZukZokeomk0y2UY0R2GHpeJ8Mc';
        let tableData = [];

        // Luetaan Google Sheetsin tarjoama JSONP-datavirta
        function koodiMestari(data) {
            try {
                if (!data || !data.table || !data.table.rows) {
                    document.getElementById('loading').innerText = 'Virhe tiedon rakenteessa. Varmista taulukko.';
                    return;
                }

                const rows = data.table.rows;
                
                // Muunnetaan Googlen JSON-rakenne puhtaaksi taulukoksi
                let rawData = rows.map(row => {
                    if (!row || !row.c) return [];
                    return row.c.map(cell => {
                        if (!cell) return '';
                        return cell.f ? cell.f : (cell.v !== null ? cell.v : '');
                    });
                }).filter(row => row.length > 0);

                // Ohitetaan mahdollinen otsikkorivi
                if (rawData.length > 0 && rawData[0][0].toString().toLowerCase().includes('pelaaja')) {
                    rawData.shift();
                }

                tableData = rawData;

                if (tableData.length === 0) {
                    document.getElementById('loading').innerText = 'Pelaajatietoja ei löytynyt.';
                    return;
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('statsTable').style.display = 'table';
                
                renderTable(tableData);
            } catch (error) {
                document.getElementById('loading').innerText = 'Virhe tietojen tulkinnassa.';
                console.error(error);
            }
        }

        // Luodaan dynaaminen skriptikutsu joka ohittaa CORS-suojaukset
        const script = document.createElement('script');
        script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:koodiMestari&gid=0`;
        document.body.appendChild(script);

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach(row => {
                const tr = document.createElement('tr');
                
                const name = row[0] || '';
                const o = row[1] || '0';
                const v = row[2] || '0';
                const m = row[3] || '0';
                let gpg = row[4] || '';
                let vPct = row[5] || '';
                const ga = row[6] || '0';
                let gaa = row[7] || '';

                // Piilotetaan tyhjät tai nollakeskiarvot näkyvistä
                if (gpg == '0' || gpg == '0.00') gpg = '';
                if (gaa == '0' || gaa == '0.00') gaa = '';
                if (vPct == '0' || vPct == '0%') vPct = '';

                tr.innerHTML = `
                    <td><b>${name}</b></td>
                    <td>${o}</td>
                    <td>${v}</td>
                    <td>${m}</td>
                    <td>${gpg}</td>
                    <td>${vPct}</td>
                    <td>${ga}</td>
                    <td>${gaa}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function sortData(columnIndex, direction) {
            tableData.sort((a, b) => {
                let valA = (a[columnIndex] || '0').toString();
                let valB = (b[columnIndex] || '0').toString();

                let numA = parseFloat(valA.replace(',', '.').replace('%', '')) || 0;
                let numB = parseFloat(valB.replace(',', '.').replace('%', '')) || 0;

                if (direction === 'asc') {
                    return numA > numB ? 1 : -1;
                } else {
                    return numA < numB ? 1 : -1;
                }
            });
            renderTable(tableData);
        }
    </script>
</body>
</html>
