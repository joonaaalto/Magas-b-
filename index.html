<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelaajatilastot</title>

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#eef2f7 0%,#dfe7f1 100%);
    margin:0;
    padding:10px;
    color:#333;
    padding-bottom:80px; /* tilaa bottom barille */
}

/* HEADER */
h1{
    text-align:center;
    font-size:28px;
    font-weight:800;
    margin-bottom:5px;
    color:#1c2733;
}

.subtitle{
    text-align:center;
    font-size:14px;
    color:#64748b;
}

#updated{
    text-align:center;
    font-size:12px;
    color:#64748b;
    margin-bottom:15px;
}

/* NAPIT */
.button-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-bottom:15px;
}

button{
    background:linear-gradient(135deg,#2196f3,#1565c0);
    color:white;
    border:none;
    padding:10px;
    font-weight:700;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}

button:active{ transform:scale(.97); }

.full-width{
    grid-column:span 2;
    background:linear-gradient(135deg,#ef4444,#dc2626);
}

/* TAULUKKO */
.table-container{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

th{
    background:#1e293b;
    color:white;
    padding:8px 5px;
    text-align:left;
}

td{
    padding:7px 5px;
    border-bottom:1px solid #eee;
}

tbody tr:nth-child(even){
    background:#f8fafc;
}

.highlight-column{
    background:#dbeafe !important;
    font-weight:700;
}

.loading{
    text-align:center;
    padding:20px;
    font-weight:bold;
}

/* =========================
   🔽 BOTTOM SEASON BAR
========================= */

.bottom-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#0f172a;
    padding:10px;
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    box-shadow:0 -4px 15px rgba(0,0,0,.2);
}

.bottom-bar select{
    padding:10px;
    border-radius:10px;
    border:none;
    font-weight:700;
    background:#1e293b;
    color:white;
    outline:none;
}

.bottom-bar button{
    padding:10px 14px;
    border-radius:10px;
    background:linear-gradient(135deg,#0ea5e9,#0284c7);
    border:none;
    font-weight:800;
}
</style>
</head>

<body>

<h1>🏆 Pelaajatilastot</h1>
<div class="subtitle">Google Sheets kausittain</div>
<div id="updated"></div>

<div class="button-grid">
    <button onclick="sortData(1,'desc')">Ottelut ↓</button>
    <button onclick="sortData(1,'asc')">Ottelut ↑</button>

    <button onclick="sortData(2,'desc')">Voitot ↓</button>
    <button onclick="sortData(2,'asc')">Voitot ↑</button>

    <button onclick="sortData(3,'desc')">Maalit ↓</button>
    <button onclick="sortData(3,'asc')">Maalit ↑</button>

    <button onclick="sortData(4,'desc')">GPG</button>
    <button onclick="sortData(4,'asc')">GPG ↑</button>

    <button onclick="sortData(5,'desc')">V%</button>
    <button onclick="sortData(5,'asc')">V% ↑</button>

    <button onclick="sortData(6,'desc')" class="full-width">
        Päästetyt maalit
    </button>
</div>

<div class="table-container">
    <div id="loading" class="loading">Ladataan...</div>

    <table id="statsTable" style="display:none;">
        <thead>
        <tr>
            <th>Pelaaja</th>
            <th>O</th>
            <th>V</th>
            <th>M</th>
            <th>GPG</th>
            <th>V%</th>
            <th>GA</th>
            <th>GAA</th>
        </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<!-- 🔽 BOTTOM SEASON SELECT -->
<div class="bottom-bar">
    <select id="seasonSelect" onchange="changeSeason()">
        <option value="0">🏆 Kausi 1</option>
        <option value="123456789">📅 Kausi 2</option>
    </select>

    <button onclick="reloadSeason()">Vaihda</button>
</div>

<script>

const sheetId = '11GpJty25_ftRoKPs_ZukZokeomk0y2UY0R2GHpeJ8Mc';

let tableData = [];
let activeColumn = null;
let currentGid = 0;

/* LOAD SHEET */
function loadSheet(gid){

    currentGid = gid;

    document.getElementById('loading').style.display='block';
    document.getElementById('statsTable').style.display='none';

    const old = document.getElementById('sheetScript');
    if(old) old.remove();

    const script = document.createElement('script');
    script.id = 'sheetScript';

    script.src =
    `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:koodiMestari&gid=${gid}`;

    document.body.appendChild(script);
}

/* CALLBACK */
function koodiMestari(data){

    if(!data || !data.table) return;

    let rows = data.table.rows;

    tableData = rows.map(r =>
        r.c.map(c => c ? (c.f || c.v || '') : '')
    );

    if(tableData.length && tableData[0][0].toLowerCase().includes('pelaaja')){
        tableData.shift();
    }

    document.getElementById('loading').style.display='none';
    document.getElementById('statsTable').style.display='table';

    renderTable(tableData);
}

/* RENDER */
function renderTable(data){

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML='';

    data.forEach(row=>{

        const tr = document.createElement('tr');

        tr.innerHTML = `
        <td class="${activeColumn===0?'highlight-column':''}"><b>${row[0]}</b></td>
        <td class="${activeColumn===1?'highlight-column':''}">${row[1]}</td>
        <td class="${activeColumn===2?'highlight-column':''}">${row[2]}</td>
        <td class="${activeColumn===3?'highlight-column':''}">${row[3]}</td>
        <td class="${activeColumn===4?'highlight-column':''}">${row[4]}</td>
        <td class="${activeColumn===5?'highlight-column':''}">${row[5]}</td>
        <td class="${activeColumn===6?'highlight-column':''}">${row[6]}</td>
        <td class="${activeColumn===7?'highlight-column':''}">${row[7]}</td>
        `;

        tbody.appendChild(tr);
    });
}

/* SORT */
function sortData(i,dir){

    activeColumn = i;

    tableData.sort((a,b)=>{

        let A = parseFloat((a[i]||0).toString().replace(',','.'))||0;
        let B = parseFloat((b[i]||0).toString().replace(',','.'))||0;

        return dir==='asc' ? A-B : B-A;
    });

    renderTable(tableData);
}

/* SEASON CHANGE */
function changeSeason(){
    currentGid = document.getElementById('seasonSelect').value;
}

function reloadSeason(){
    loadSheet(currentGid);
}

/* INIT */
loadSheet(0);

</script>

</body>
</html>
