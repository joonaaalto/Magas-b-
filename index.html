<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelaajatilastot</title>

<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#eef2f7 0%,#dfe7f1 100%);
    color:#333;
    margin:0;
    padding:10px;
    min-height:100vh;
}

h1{
    text-align:center;
    font-size:30px;
    font-weight:800;
    margin-bottom:5px;
    color:#1c2733;
}

.subtitle{
    text-align:center;
    color:#64748b;
    font-size:14px;
    margin-bottom:5px;
}

#updated{
    text-align:center;
    color:#64748b;
    font-size:12px;
    margin-bottom:18px;
}

.button-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-bottom:18px;
}

button{
    background:linear-gradient(135deg,#2196f3,#1565c0);
    color:white;
    border:none;
    padding:10px;
    font-size:13px;
    font-weight:700;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 3px 8px rgba(0,0,0,.12);
}

button:hover{
    transform:translateY(-2px);
}

button:active{
    transform:scale(.97);
}

.full-width{
    grid-column:span 2;
    background:linear-gradient(135deg,#ef4444,#dc2626);
}

.table-container{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:
        0 8px 24px rgba(0,0,0,.08),
        0 2px 6px rgba(0,0,0,.04);
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

th{
    background:#1e293b;
    color:white;
    font-weight:700;
    letter-spacing:.3px;
    padding:8px 5px;
    text-align:left;
}

td{
    padding:7px 5px;
    border-bottom:1px solid #eceff3;
}

tbody tr:nth-child(even){
    background:#f8fafc;
}

tbody tr:hover{
    background:#eef6ff !important;
}

.loading{
    text-align:center;
    padding:20px;
    font-weight:bold;
    color:#666;
}

.highlight-column{
    background:#dbeafe !important;
    font-weight:700;
}

.rank1{
    color:#b8860b;
    font-weight:800;
}

.rank2{
    color:#6b7280;
    font-weight:800;
}

.rank3{
    color:#b45309;
    font-weight:800;
}

/* Pelaajasarake kapeammaksi */
th:first-child,
td:first-child{
    max-width:95px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* Mobiili */
@media (max-width:600px){

    body{
        padding:6px;
    }

    table{
        font-size:11px;
    }

    th{
        padding:6px 3px;
    }

    td{
        padding:6px 3px;
    }

    th:first-child,
    td:first-child{
        max-width:70px;
    }

    h1{
        font-size:24px;
    }

    button{
        font-size:11px;
        padding:8px 4px;
    }
}
</style>
</head>

<body>

<h1>🏆 Pelaajatilastot</h1>
<div class="subtitle">Google Sheetsistä päivittyvät tilastot</div>
<div id="updated"></div>

<div class="button-grid">
    <button onclick="sortData(1,'desc')">Ottelut ↓</button>
    <button onclick="sortData(1,'asc')">Ottelut ↑</button>

    <button onclick="sortData(2,'desc')">Voitot ↓</button>
    <button onclick="sortData(2,'asc')">Voitot ↑</button>

    <button onclick="sortData(3,'desc')">Maalit ↓</button>
    <button onclick="sortData(3,'asc')">Maalit ↑</button>

    <button onclick="sortData(4,'desc')">Paras GPG</button>
    <button onclick="sortData(4,'asc')">Pienin GPG</button>

    <button onclick="sortData(5,'desc')">Paras V%</button>
    <button onclick="sortData(5,'asc')">Pienin V%</button>

    <button onclick="sortData(6,'desc')" class="full-width">
        Päästetyt maalit
    </button>
</div>

<div class="table-container">
    <div id="loading" class="loading">
        Ladataan tilastoja...
    </div>

    <table id="statsTable" style="display:none;">
        <thead>
            <tr>
                <th>Pelaaja</th>
                <th>O</th>
                <th>V</th>
                <th>M</th>
                <th>GPG</th>
                <th>V%</th>
                <th>GA</th>
                <th>GAA</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
const sheetId = '11GpJty25_ftRoKPs_ZukZokeomk0y2UY0R2GHpeJ8Mc';

let tableData = [];
let activeColumn = null;

document.getElementById("updated").textContent =
    "Päivitetty: " + new Date().toLocaleString("fi-FI");

function koodiMestari(data){

    try{

        if(!data || !data.table || !data.table.rows){
            document.getElementById('loading').innerText =
            'Virhe tiedon rakenteessa.';
            return;
        }

        const rows = data.table.rows;

        let rawData = rows.map(row=>{
            if(!row || !row.c) return [];

            return row.c.map(cell=>{
                if(!cell) return '';
                return cell.f ? cell.f : (cell.v !== null ? cell.v : '');
            });

        }).filter(row=>row.length > 0);

        if(
            rawData.length > 0 &&
            rawData[0][0].toString().toLowerCase().includes('pelaaja')
        ){
            rawData.shift();
        }

        tableData = rawData;

        document.getElementById('loading').style.display='none';
        document.getElementById('statsTable').style.display='table';

        renderTable(tableData);

    }catch(error){
        console.error(error);
    }
}

const script = document.createElement('script');
script.src =
`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:koodiMestari&gid=0`;
document.body.appendChild(script);

function renderTable(data){

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML='';

    data.forEach((row,index)=>{

        const tr = document.createElement('tr');

        const name = row[0] || '';
        const o = row[1] || '0';
        const v = row[2] || '0';
        const m = row[3] || '0';

        let gpg = row[4] || '';
        let vpct = row[5] || '';

        const ga = row[6] || '0';
        let gaa = row[7] || '';

        if(gpg=='0' || gpg=='0.00') gpg='';
        if(gaa=='0' || gaa=='0.00') gaa='';
        if(vpct=='0' || vpct=='0%') vpct='';

        let medal = '';
        let rankClass = '';

        if(index===0){ medal='🥇 '; rankClass='rank1'; }
        else if(index===1){ medal='🥈 '; rankClass='rank2'; }
        else if(index===2){ medal='🥉 '; rankClass='rank3'; }

        tr.innerHTML = `
            <td class="${activeColumn===0?'highlight-column':''} ${rankClass}"><b>${medal}${name}</b></td>
            <td class="${activeColumn===1?'highlight-column':''}">${o}</td>
            <td class="${activeColumn===2?'highlight-column':''}">${v}</td>
            <td class="${activeColumn===3?'highlight-column':''}">${m}</td>
            <td class="${activeColumn===4?'highlight-column':''}">${gpg}</td>
            <td class="${activeColumn===5?'highlight-column':''}">${vpct}</td>
            <td class="${activeColumn===6?'highlight-column':''}">${ga}</td>
            <td class="${activeColumn===7?'highlight-column':''}">${gaa}</td>
        `;

        tbody.appendChild(tr);
    });
}

function sortData(columnIndex,direction){

    activeColumn = columnIndex;

    tableData.sort((a,b)=>{

        let valA=(a[columnIndex]||'0').toString();
        let valB=(b[columnIndex]||'0').toString();

        let numA=parseFloat(valA.replace(',','.').replace('%','')) || 0;
        let numB=parseFloat(valB.replace(',','.').replace('%','')) || 0;

        return direction==='asc'
            ? (numA > numB ? 1 : -1)
            : (numA < numB ? 1 : -1);
    });

    renderTable(tableData);
}
</script>

</body>
</html>
