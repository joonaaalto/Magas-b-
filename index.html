html<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelaajatilastot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 10px; }
        h1 { text-align: center; font-size: 24px; margin-bottom: 15px; color: #1a1a1a; }
        .button-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 8px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button:active { background-color: #0056b3; }
        .full-width { grid-column: span 2; background-color: #dc3545; }
        .full-width:active { background-color: #bd2130; }
        .table-container { background: white; border-radius: 10px; overflow-x: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #eeeeee; white-space: nowrap; }
        th { background-color: #f8f9fa; font-weight: bold; color: #666; }
        tr:last-child td { border-bottom: none; }
        .loading { text-align: center; padding: 20px; font-weight: bold; color: #666; }
    </style>
</head>
<body>

    <h1>🏆 Pelaajatilastot</h1>

    <div class="button-grid">
        <button onclick="sortData(1, 'desc')">Ottelut (Isot ensin)</button>
        <button onclick="sortData(1, 'asc')">Ottelut (Pienet ensin)</button>
        <button onclick="sortData(2, 'desc')">Voitot (Isot ensin)</button>
        <button onclick="sortData(2, 'asc')">Voitot (Pienet ensin)</button>
        <button onclick="sortData(3, 'desc')">Maalit (Isot ensin)</button>
        <button onclick="sortData(3, 'asc')">Maalit (Pienet ensin)</button>
        <button onclick="sortData(4, 'desc')">Paras GPG</button>
        <button onclick="sortData(4, 'asc')">Pienin GPG</button>
        <button onclick="sortData(5, 'desc')">Paras Voitto%</button>
        <button onclick="sortData(5, 'asc')">Pienin Voitto%</button>
        <button onclick="sortData(6, 'desc')" class="full-width">Päästetyt maalit</button>
    </div>

    <div class="table-container">
        <div id="loading" class="loading">Ladataan tilastoja...</div>
        <table id="statsTable" style="display:none;">
            <thead>
                <tr>
                    <th>Pelaaja</th>
                    <th>O</th>
                    <th>V</th>
                    <th>M</th>
                    <th>GPG</th>
                    <th>V%</th>
                    <th>GA</th>
                    <th>GAA</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const sheetId = '11GpJty25_ftRoKPs_ZukZokeomk0y2UY0R2GHpeJ8Mc';
        let tableData = [];

        // Luetaan Google Sheetsin tarjoama JSONP-datavirta turvallisesti
        function koodiMestari(data) {
            try {
                if (!data || !data.table || !data.table.rows) {
                    document.getElementById('loading').innerText = 'Virhe tiedon hakemisessa.';
                    return;
                }

                const rows = data.table.rows;
                
                // Puretaan Googlen rakenne taulukkomuotoon ja siivotaan mahdolliset tyhjät solut
                let rawData = rows.map(row => {
                    if (!row || !row.c) return [];
                    return row.c.map(cell => {
                        if (!cell || cell.v === null || cell.v === undefined) return '';
                        return cell.f ? cell.f : cell.v;
                    });
                }).filter(row => row.length > 0);

                // Ohitetaan mahdollinen otsikkorivi automaattisesti
                if (rawData.length > 0 && rawData[0][0].toString().toLowerCase().includes('pelaaja')) {
                    rawData.shift();
                }

                tableData = rawData;

                if (tableData.length === 0) {
                    document.getElementById('loading').innerText = 'Pelaajatietoja ei löytynyt.';
                    return;
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('statsTable').style.display = 'table';
                
                renderTable(tableData);
            } catch (error) {
                document.getElementById('loading').innerText = 'Virhe tietojen käsittelyssä.';
                console.error(error);
            }
        }

        // Tehdään dynaaminen haku JSONP-tekniikalla, joka kiertää selainten CORS-lukitukset poikkeuksetta
        const script = document.createElement('script');
        script.src = `https://google.com{sheetId}/gviz/tq?tqx=responseHandler:koodiMestari&gid=0`;
        document.body.appendChild(script);

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach(row => {
                const tr = document.createElement('tr');
                
                // Varmistetaan sarakkeiden turvallinen poiminta (A-H) ilman kaatumisriskiä
                let name = row[0] !== undefined && row[0] !== null ? row[0] : '';
                let o = row[1] !== undefined && row[1] !== null ? row[1] : '0';
                let v = row[2] !== undefined && row[2] !== null ? row[2] : '0';
                let m = row[3] !== undefined && row[3] !== null ? row[3] : '0';
                let gpg = row[4] !== undefined && row[4] !== null ? row[4] : '';
                let vPct = row[5] !== undefined && row[5] !== null ? row[5] : '';
                let ga = row[6] !== undefined && row[6] !== null ? row[6] : '0';
                let gaa = row[7] !== undefined && row[7] !== null ? row[7] : '';

                // Siivotaan Excel-laskuvirheet tai raa'at nollat piiloon, jos ne sotkevat taulukkoa
                if (gpg == '0' || gpg == '0.00' || gpg.toString().includes('#')) gpg = '';
                if (gaa == '0' || gaa == '0.00' || gaa.toString().includes('#')) gaa = '';
                if (vPct == '0' || vPct == '0%' || vPct.toString().includes('#')) vPct = '';

                tr.innerHTML = `
                    <td><b>${name}</b></td>
                    <td>${o}</td>
                    <td>${v}</td>
                    <td>${m}</td>
                    <td>${gpg}</td>
                    <td>${vPct}</td>
                    <td>${ga}</td>
                    <td>${gaa}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function sortData(columnIndex, direction) {
            tableData.sort((a, b) => {
                let valA = a[columnIndex] !== undefined && a[columnIndex] !== null ? a[columnIndex].toString() : '0';
                let valB = b[columnIndex] !== undefined && b[columnIndex] !== null ? b[columnIndex].toString() : '0';

                // Siivotaan suomalaiset pilkkudesimaalit ja prosenttimerkit puhtaiksi numeroiksi
                let numA = parseFloat(valA.replace(',', '.').replace('%', '')) || 0;
                let numB = parseFloat(valB.replace(',', '.').replace('%', '')) || 0;

                if (direction === 'asc') {
                    return numA > numB ? 1 : -1;
                } else {
                    return numA < numB ? 1 : -1;
                }
            });
            renderTable(tableData);
        }
    </script>
</body>
</html>
